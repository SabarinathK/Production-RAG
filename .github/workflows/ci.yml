name: Production RAG CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run Test Suite
        env:
          QDRANT_HOST: ":memory:"
          APP_ENV: development
          SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
        run: |
          pytest -v --tb=short

      - name: Run Automated Evaluation Benchmark
        env:
          QDRANT_HOST: ":memory:"
          APP_ENV: development
        run: |
          python -m evals.eval_runner


  docker-build-check:
    name: Validate Docker Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t prod-rag:latest .

      - name: Smoke-test container health endpoint
        run: |
          docker run -d --name rag-smoke-test \
            -e QDRANT_HOST=":memory:" \
            -e APP_ENV=development \
            -e SECRET_KEY=ci-smoke-secret-key-at-least-32-bytes \
            -p 8000:8000 prod-rag:latest
          sleep 8
          curl -f http://localhost:8000/health || (docker logs rag-smoke-test && exit 1)
          docker stop rag-smoke-test
