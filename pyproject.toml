[project]
name = "prod-rag"
version = "0.1.0"
description = "Production-grade Enterprise RAG System Architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.3",
    "qdrant-client>=1.8.0",
    "langgraph>=0.0.26",
    "langchain-core>=0.1.30",
    "fastembed>=0.2.2",
    "rank-bm25>=0.2.2",
    "celery>=5.3.6",
    "pika>=1.3.2",
    "presidio-analyzer>=2.2.353",
    "presidio-anonymizer>=2.2.353",
    "pymupdf>=1.23.26",
    "python-docx>=1.1.0",
    "boto3>=1.30.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-exporter-otlp>=1.23.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "rag", "ingestion"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
